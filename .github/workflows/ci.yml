name: CI

on:
  push:
    # タグでは走らせない（release.yml のタグトリガーと二重に走るため）
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # CARGO_BUILD_WARNINGS は使わない:
  #   cargo 1.94 系では unstable ゲートのため完全に無音の no-op になり（警告もエラーも出ずに成功する）、
  #   MSRV 1.85 のジョブでも無効。警告の error 化は各ジョブの -D warnings に統一する。

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 配布 4 ターゲットのうち x86_64-unknown-linux-gnu / aarch64-apple-darwin /
        # x86_64-pc-windows-msvc をネイティブ実行でカバーする。残り 1 つは cross-check ジョブ。
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-features --all-targets
      - run: cargo test --locked --all-features --doc

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-24.04
    env:
      # job レベルに置く。step レベルだと Swatinem/rust-cache のキー計算時に効かず、
      # 「キーは stable なのに中身は 1.85」という不整合が起きる。
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
      - run: cargo check --locked --all-targets --all-features

  cross-check:
    # リリース時に初めてターゲット固有のコンパイルエラーが出るのを防ぐ。
    # 配布 4 ターゲットのうち test ジョブがネイティブ実行でカバーする 3 つは除き、
    # 残り 1 つだけを見る。cargo check は最終バイナリをリンクしないためクロスリンカは不要だが、
    # ring（rustls の既定の暗号バックエンド）の build.rs が C コードをクロスコンパイルするため
    # クロス gcc は必要（下のステップで導入する）。
    name: check (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      # ring（rustls の既定の暗号バックエンド）は C コードを含むため、
      # クロスターゲットの cc が無いと build.rs が失敗する（リンクの話ではない）。
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross-${{ matrix.target }}
      - run: cargo check --locked --all-features --target ${{ matrix.target }}

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  dist-guard:
    # [profile.dist] を消すと dist plan は通る（= PR の plan ジョブでは検出されない）が、
    # dist build が `error: profile `dist` is not defined` で落ちる。そのため
    # 「グリーンでマージ → 次のタグ push で build ジョブ 4 つが同時失敗」になる。それをここで防ぐ。
    # なお [package.metadata.dist] dist = true の方は dist plan 自体が失敗するので
    # PR の plan ジョブで検出される（ここでは見ていない）。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Ensure [profile.dist] exists in Cargo.toml
        run: |
          grep -q '^\[profile\.dist\]' Cargo.toml \
            || { echo "::error::[profile.dist] が Cargo.toml から消えています（dist build が失敗します）"; exit 1; }
